name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # catch newly-disclosed advisories even with no commits
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # the published entry point must load and behave, not just compile
      - run: node -e "const {JsonHighlighter} = require('./dist/index.js'); if (typeof JsonHighlighter !== 'function') { throw new Error('dist entry point is broken'); }"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
